[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
publish = false
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "allow"

[workspace.dependencies]
getrandom = "0.4"
zeroize = "1"
sha2 = "0.10"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
scrypt = { version = "0.11", default-features = false }
unicode-normalization = "0.1"
secrecy = "0.10"
subtle = "2"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "multi_barcode_readers", "encoding_rs"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "tiff", "webp"] }
imageproc = { version = "0.26", default-features = false }
qrcode = { version = "0.14", default-features = false }

# Dependencies (scrypt in particular) are optimised in debug builds so tests and debug runs of
# the full-strength KDF take well under a second instead of about 13 s.
[profile.dev.package."*"]
opt-level = 3

# bcp-scan runs per-pixel image loops; keep them fast in debug test runs.
[profile.dev.package.bcp-scan]
opt-level = 3
