[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "allow"

[workspace.dependencies]
getrandom = "0.4"
zeroize = "1"
sha2 = "0.10"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
scrypt = { version = "0.11", default-features = false }
unicode-normalization = "0.1"
secrecy = "0.10"
subtle = "2"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
qrcode = { version = "0.14", default-features = false }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "multi_barcode_readers", "encoding_rs"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "tiff", "webp"] }

# Dependencies (scrypt in particular) are optimised in debug builds so tests and debug runs of
# the full-strength KDF take well under a second instead of about 13 s.
[profile.dev.package."*"]
opt-level = 3

# Bitmap rendering and its tests move millions of pixels; unoptimised they take about a minute.
[profile.dev.package.bcp-render]
opt-level = 3

# bcp-scan runs per-pixel image loops; keep them fast in debug test runs.
[profile.dev.package.bcp-scan]
opt-level = 3

# Release builds (step 7.2, DECISIONS entry 11). Dev and test profiles are unchanged. `panic`
# stays at its default (unwind): the GUI panic hook and worker rely on it. Path remapping and
# SOURCE_DATE_EPOCH are set by .github/workflows/release.yml, not here.
[profile.release]
codegen-units = 1
lto = true
strip = true
