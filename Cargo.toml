[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
publish = false
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "allow"

[workspace.dependencies]
getrandom = "0.4"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
