[graph]
all-features = true

[advisories]
version = 2
# ttf-parser (via ab_glyph) is unmaintained, not vulnerable. It parses only the embedded font
# and an optional font file the user names. See docs/DECISIONS.md entry 5.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; no known vulnerability, parses trusted font bytes only" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "OFL-1.1",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Networking is forbidden by design (CLAUDE.md rule 2).
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "ureq" },
    { crate = "h2" },
    { crate = "rustls" },
    { crate = "native-tls" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "isahc" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "attohttpc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
