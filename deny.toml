[graph]
all-features = true
# Only the platforms we ship. Without this, wasm-only edges (wasm-bindgen-futures -> tokio)
# would trip the async runtime ban below.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
# ttf-parser (via ab_glyph) is unmaintained, not vulnerable. It parses only the embedded font
# and an optional font file the user names. See docs/DECISIONS.md entry 5.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; no known vulnerability, parses trusted font bytes only" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "OFL-1.1",
    "Unicode-3.0",
]

# Boost Software Licence: Windows-only clipboard crates pulled by eframe's forced clipboard.
exceptions = [
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Networking is forbidden by design (CLAUDE.md rule 2).
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "ureq" },
    { crate = "h2" },
    { crate = "rustls" },
    { crate = "native-tls" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "isahc" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "attohttpc" },
    # No async runtime or D-Bus client: AccessKit is off (docs/DECISIONS.md entry 7).
    { crate = "tokio" },
    { crate = "zbus" },
    { crate = "async-io" },
    { crate = "mio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
