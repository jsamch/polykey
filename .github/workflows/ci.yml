name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (gui feature)
        run: cargo clippy -p bcp-app --features gui --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test (gui feature)
        run: cargo test -p bcp-app --features gui

  slow:
    name: slow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Slow tests (full-strength scrypt)
        run: cargo test --workspace --release -- --ignored --nocapture

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  vectors:
    name: vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check golden vectors against the reference
        run: python3 tools/make_vectors.py --check

  cross-check:
    name: cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p bcp-app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fixed plates (--demo-seed in tools/cross_check.py) plus a pinned decoder make the
      # image cases deterministic.
      - name: Install OpenCV for the image cases
        run: pip install "opencv-python-headless==4.14.0.94" numpy
      - name: Rust and Python read each other's sets and plate images
        run: python3 tools/cross_check.py --bcp target/release/bcp --images
