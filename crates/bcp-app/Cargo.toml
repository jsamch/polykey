[package]
name = "bcp-app"
description = "The bcp command line tool and GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "bcp"
path = "src/main.rs"

[features]
gui = ["dep:eframe", "dep:rfd", "dep:windows-sys", "dep:raw-window-handle"]

[dependencies]
bcp-core = { version = "0.1.0", path = "../bcp-core" }
bcp-render = { version = "0.1.0", path = "../bcp-render" }
bcp-scan = { version = "0.1.0", path = "../bcp-scan" }
clap.workspace = true
rpassword.workspace = true
sha2.workspace = true
zeroize.workspace = true
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["glow", "wayland", "x11"] }
rfd = { version = "0.17.2", optional = true, default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, default-features = false, features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# The window handle eframe exposes, for screen capture exclusion (DECISIONS entry 10). The same
# version eframe already uses, so no crate is added to the tree.
raw-window-handle = { version = "0.6.2", optional = true, default-features = false }

[dev-dependencies]
ab_glyph.workspace = true
serde_json.workspace = true
egui_kittest = "0.36.2"
